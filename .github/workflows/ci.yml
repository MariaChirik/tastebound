name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 services

  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, catalog, order, payment, tracking, notification, recommendation]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Run unit tests with coverage
        working-directory: services/${{ matrix.service }}
        run: >-
          mkdir -p ../../reports &&
          python -m pytest -v
          --junitxml=../../reports/${{ matrix.service }}-junit.xml
          --cov=app --cov-report=term-missing
          --cov-report=xml:../../reports/${{ matrix.service }}-coverage.xml
          --cov-fail-under=85

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.service }}
          path: reports/

  frontend-test:
    name: test (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontend tests
        working-directory: frontend
        run: >-
          mkdir -p ../reports &&
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=../reports/frontend-junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-frontend
          path: reports/

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: docker build (${{ matrix.name }})
    needs: [lint, test, secrets-scan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth, context: services/auth }
          - { name: catalog, context: services/catalog }
          - { name: order, context: services/order }
          - { name: payment, context: services/payment }
          - { name: tracking, context: services/tracking }
          - { name: notification, context: services/notification }
          - { name: recommendation, context: services/recommendation }
          - { name: frontend, context: frontend }
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tastebound-${{ matrix.name }}:ci ${{ matrix.context }}

  compose-config:
    name: compose config
    needs: [lint, test, secrets-scan]
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f deploy/docker-compose.yml config --quiet

  api-tests:
    name: api tests (newman)
    needs: [compose-config, docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from GitHub Secrets
        env:
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          test -n "$AUTH_SECRET_KEY" && test -n "$POSTGRES_PASSWORD" && test -n "$ADMIN_PASSWORD"
          {
            echo "AUTH_SECRET_KEY=$AUTH_SECRET_KEY"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "ADMIN_EMAIL=admin@tastebound.local"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
          } > .env

      - name: Start the application
        run: docker compose -f deploy/docker-compose.yml --env-file .env up -d --build --wait

      - name: Check services through the gateway
        run: |
          for s in auth catalog orders payments tracking notifications recommendations; do
            curl -fsS "http://localhost:8080/api/$s/health"; echo
          done
          curl -fsS http://localhost:8080/ > /dev/null

      - name: Run Postman collection with Newman
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm --network tastebound_frontend \
            -v "$PWD/tests/postman:/etc/newman" -v "$PWD/reports:/reports" \
            postman/newman:6-alpine run tastebound.postman_collection.json \
            -e ci.postman_environment.json \
            --reporters cli,junit --reporter-junit-export /reports/newman-junit.xml

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-tests-newman
          path: reports/

      - name: Show logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file .env logs --tail=50

      - name: Stop the application
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file .env down -v

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate

  k8s-manifests:
    name: kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        run: |
          docker run --rm -v "$PWD/deploy/k8s:/k8s" ghcr.io/yannh/kubeconform:latest \
            -strict -summary -ignore-filename-pattern 'kustomization.yaml' /k8s

  publish:
    name: publish image (${{ matrix.name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth, context: services/auth }
          - { name: catalog, context: services/catalog }
          - { name: order, context: services/order }
          - { name: payment, context: services/payment }
          - { name: tracking, context: services/tracking }
          - { name: notification, context: services/notification }
          - { name: recommendation, context: services/recommendation }
          - { name: frontend, context: frontend }
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tastebound-${{ matrix.name }}"
          docker build -t "$image:latest" -t "$image:${GITHUB_SHA::7}" ${{ matrix.context }}
          docker push --all-tags "$image"

server {
  listen 80;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $upstream frontend;
    proxy_pass http://$upstream:80;
    proxy_set_header Host $host;
  }

  location /api/auth/ {
    set $upstream auth;
    rewrite ^/api/auth/(.*)$ /$1 break;
    proxy_pass http://$upstream:5000;
  }

  location /api/catalog/ {
    set $upstream catalog;
    rewrite ^/api/catalog/(.*)$ /$1 break;
    proxy_pass http://$upstream:5000;
  }

  location /api/orders/ {
    set $upstream order;
    rewrite ^/api/orders/(.*)$ /$1 break;
    proxy_pass http://$upstream:5000;
  }

  location /api/payments/ {
    set $upstream payment;
    rewrite ^/api/payments/(.*)$ /$1 break;
    proxy_pass http://$upstream:5000;
  }

  location /api/tracking/ {
    set $upstream tracking;
    rewrite ^/api/tracking/(.*)$ /$1 break;
    proxy_pass http://$upstream:5000;
  }

  location /api/notifications/ {
    set $upstream notification;
    rewrite ^/api/notifications/(.*)$ /$1 break;
    proxy_pass http://$upstream:5000;
  }

  location /api/recommendations/ {
    set $upstream recommendation;
    rewrite ^/api/recommendations/(.*)$ /$1 break;
    proxy_pass http://$upstream:5000;
  }
}

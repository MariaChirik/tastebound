apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: tastebound
  labels:
    app: gateway-config
data:
  default.conf: |
    server {
      listen 80;

      location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
      }

      location /api/auth/ { proxy_pass http://auth:5000/; }
      location /api/catalog/ { proxy_pass http://catalog:5000/; }
      location /api/orders/ { proxy_pass http://order:5000/; }
      location /api/payments/ { proxy_pass http://payment:5000/; }
      location /api/tracking/ { proxy_pass http://tracking:5000/; }
      location /api/notifications/ { proxy_pass http://notification:5000/; }
      location /api/recommendations/ { proxy_pass http://recommendation:5000/; }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: tastebound
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: tastebound
  labels:
    app: gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d
        readinessProbe:
          httpGet:
            path: /api/auth/health
            port: 80
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
      volumes:
      - name: config
        configMap:
          name: gateway-config

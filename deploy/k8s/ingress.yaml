apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tastebound
  namespace: tastebound
  labels:
    app: tastebound
spec:
  ingressClassName: traefik
  rules:
  - host: mail.tastebound.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mailpit
            port:
              number: 8025
  - host: tastebound.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 80
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 80

apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: tastebound
  labels:
    app: notification
spec:
  selector:
    app: notification
  ports:
  - name: http
    port: 5000
    targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: tastebound
  labels:
    app: notification
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
      - name: notification
        image: ghcr.io/mariachirik/tastebound-notification:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: AUTH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: tastebound-secrets
              key: AUTH_SECRET_KEY
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: tastebound-config
              key: REDIS_URL
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: tastebound
  labels:
    app: notification-worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
      - name: notification-worker
        image: ghcr.io/mariachirik/tastebound-notification:latest
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - app.worker
        env:
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: tastebound-config
              key: REDIS_URL
        - name: SMTP_HOST
          valueFrom:
            configMapKeyRef:
              name: tastebound-config
              key: SMTP_HOST
        - name: SMTP_PORT
          valueFrom:
            configMapKeyRef:
              name: tastebound-config
              key: SMTP_PORT
        - name: SMTP_FROM
          valueFrom:
            configMapKeyRef:
              name: tastebound-config
              key: SMTP_FROM
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi

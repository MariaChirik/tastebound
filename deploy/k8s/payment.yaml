apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: tastebound
  labels:
    app: payment
spec:
  selector:
    app: payment
  ports:
  - name: http
    port: 5000
    targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: tastebound
  labels:
    app: payment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
      - name: payment
        image: ghcr.io/mariachirik/tastebound-payment:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: AUTH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: tastebound-secrets
              key: AUTH_SECRET_KEY
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: tastebound-config
              key: REDIS_URL
        - name: LIQPAY_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: tastebound-secrets
              key: LIQPAY_PUBLIC_KEY
              optional: true
        - name: LIQPAY_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: tastebound-secrets
              key: LIQPAY_PRIVATE_KEY
              optional: true
        - name: LIQPAY_RESULT_URL
          valueFrom:
            configMapKeyRef:
              name: tastebound-config
              key: LIQPAY_RESULT_URL
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi

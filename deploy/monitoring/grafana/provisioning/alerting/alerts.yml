apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-admin
    receivers:
      - uid: email-admin
        type: email
        settings:
          addresses: admin@tastebound.local

policies:
  - orgId: 1
    receiver: email-admin
    group_by: [alertname]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: tastebound
    folder: Tastebound
    interval: 30s
    rules:
      - uid: service-down
        title: Сервіс недоступний
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: up{job!="prometheus"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Сервіс {{ $labels.job }} недоступний
          description: Prometheus не може отримати метрики сервісу {{ $labels.job }} більше хвилини.
        labels:
          severity: critical
      - uid: server-errors
        title: Багато помилок 5xx
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (service) (increase(http_requests_total{status=~"5.."}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: Сервіс {{ $labels.service }} повертає помилки 5xx
          description: За останні 5 хвилин сервіс повернув понад 5 відповідей з кодом 5xx.
        labels:
          severity: warning
      - uid: slow-responses
        title: Повільні відповіді
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Сервіс {{ $labels.service }} відповідає повільно
          description: 95% запитів сервісу {{ $labels.service }} тривають довше за 1 секунду.
        labels:
          severity: warning

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: auth
    static_configs:
      - targets: ['auth:5000']
  - job_name: catalog
    static_configs:
      - targets: ['catalog:5000']
  - job_name: order
    static_configs:
      - targets: ['order:5000']
  - job_name: payment
    static_configs:
      - targets: ['payment:5000']
  - job_name: tracking
    static_configs:
      - targets: ['tracking:5000']
  - job_name: notification
    static_configs:
      - targets: ['notification:5000']
  - job_name: recommendation
    static_configs:
      - targets: ['recommendation:5000']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tastebound</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Tastebound</h1>
    <nav>
      <button type="button" data-view="catalog" data-for="guest client">Каталог</button>
      <button type="button" data-view="cart" data-for="guest client">
        Кошик (<span id="cart-count">0</span>)
      </button>
      <button type="button" data-view="group" data-for="client">Спільне замовлення</button>
      <button type="button" data-view="orders" data-for="client">Мої замовлення</button>
      <button type="button" data-view="recs" data-for="client">Оцінки</button>
      <button type="button" data-view="work" data-for="restaurant_staff courier">Кабінет</button>
      <button type="button" data-view="admin" data-for="admin">Адміністрування</button>
      <button type="button" data-view="alerts" data-for="client restaurant_staff courier admin">
        Сповіщення <span id="alerts-count" class="badge" hidden></span>
      </button>
      <button type="button" data-view="account" id="account-nav">Вхід</button>
    </nav>
  </header>

  <p id="message" class="message" role="status"></p>

  <main>
    <section id="view-catalog">
      <h2>Каталог страв</h2>
      <label>Дієта
        <select id="diet-select"></select>
      </label>
      <p id="profile-note" class="note"></p>
      <div id="dish-grid" class="grid"></div>
    </section>

    <section id="view-cart" hidden>
      <h2>Кошик</h2>
      <div id="cart-body"></div>
    </section>

    <section id="view-group" hidden>
      <h2>Спільне замовлення</h2>
      <div id="group-body"></div>
    </section>

    <section id="view-orders" hidden>
      <h2>Мої замовлення</h2>
      <div id="order-list" class="stack"></div>
    </section>

    <section id="view-work" hidden>
      <h2 id="work-title">Кабінет</h2>
      <div id="work-body"></div>
    </section>

    <section id="view-admin" hidden>
      <h2>Панель адміністратора</h2>
      <div id="admin-body"></div>
    </section>

    <section id="view-alerts" hidden>
      <h2>Сповіщення</h2>
      <p class="note">Ці ж повідомлення надходять на вашу пошту.</p>
      <ul id="alerts-list" class="alerts"></ul>
    </section>

    <section id="view-recs" hidden>
      <h2>Оцінки та рекомендації</h2>
      <div id="rate-body"></div>
    </section>

    <section id="view-account" hidden>
      <h2>Акаунт</h2>
      <div id="account-body"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
